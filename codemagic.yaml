workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Setup Android Platform
        script: flutter create . --platforms=android
      - name: Get Packages
        script: flutter pub get
      - name: Build APK Release
        script: flutter build apk --release --enable-experiment=dot-shorthands
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
